services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beasiswa-backend-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - beasiswa-net

  nginx:
    image: nginx:alpine
    container_name: beasiswa-backend-nginx
    restart: unless-stopped
    ports:
      - "${DOCKER_PORT:-8001}:80"
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - beasiswa-net

networks:
  beasiswa-net:
    driver: bridge
